[options]
;addons_path = /mnt/extra-addons,/mnt/custom-addons
data_dir = /var/lib/odoo
; admin_passwd = admin
; csv_internal_sep = ,
; db_maxconn = 64
; db_name = False
; db_template = template1
; dbfilter = .*
; debug_mode = False
; email_from = False
; limit_memory_hard = 2684354560
; limit_memory_soft = 2147483648
; limit_request = 8192
; limit_time_cpu = 60
; limit_time_real = 120
; list_db = True
; log_db = False
; log_handler = [':INFO']
; log_level = info
; logfile = None
; longpolling_port = 8072
; max_cron_threads = 2
; osv_memory_age_limit = 1.0
; osv_memory_count_limit = False
; smtp_password = False
; smtp_port = 25
; smtp_server = localhost
; smtp_ssl = False
; smtp_user = False
; workers = 0
; xmlrpc = True
; xmlrpc_interface = 
; xmlrpc_port = 8069
; xmlrpcs = True
; xmlrpcs_interface = 
; xmlrpcs_port = 8071

;[options]
; Database username
db_user = odoo

; Database password
db_password = odoo

; Database name
db_name = db_odoo

; Database host
db_host = db

; Addons path
addons_path = addons,prescrypto/campos_clientes_vittal,prescrypto/rest_api

; Development mode
dev = all

; Update modules list
; Note: There's no direct equivalent for the `-u` flag in the config file. You should run the update command manually or script it.
# modules to be updated in config file do not have a direct equivalent. You may need to script this separately.

; Logging settings
log_request = True
log_response = True
log_web = True
log_level = debug
logfile = prescrypto_odoo.log
logrotate = True

; Other common options you might need
; admin_passwd = admin_password_here
; xmlrpc_port = 8069

; Redis configuration
; Enable Redis as the cache backend
;cache = redis

; Redis server connection URL
;redis_connection_url = redis://redis:6379/0

; Long polling port (if using chat or notifications)
;longpolling_port = 8072
